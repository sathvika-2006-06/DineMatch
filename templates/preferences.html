<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Preferences - DineMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                🍽️ <span class="text-primary">DineMatch</span>
            </a>
            <span class="navbar-text">{{ group_name }} - Member {{ current_members + 1 }}/{{ total_members }}</span>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">Your Food Preferences</h2>
                        <p class="text-center text-muted mb-4">Tell us what you like! This helps us find the perfect restaurant for your group.</p>
                        
                        <form id="preferencesForm">
                            <!-- Budget -->
                            <div class="mb-4">
                                <label for="budget" class="form-label fw-bold">💰 Budget Per Person</label>
                                <select class="form-select form-select-lg" id="budget" required>
                                    <option value="">Select your budget range</option>
                                    <option value="100-200">₹100–₹200</option>
                                    <option value="200-300">₹200–₹300</option>
                                    <option value="300-500">₹300–₹500</option>
                                    <option value="500+">₹500+</option>
                                </select>
                            </div>

                            <!-- Cuisine -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">🍜 Preferred Cuisine (Select all you like)</label>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input cuisine" type="checkbox" value="Indian" id="cuisine_indian">
                                            <label class="form-check-label" for="cuisine_indian">Indian</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input cuisine" type="checkbox" value="Chinese" id="cuisine_chinese">
                                            <label class="form-check-label" for="cuisine_chinese">Chinese</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input cuisine" type="checkbox" value="Italian" id="cuisine_italian">
                                            <label class="form-check-label" for="cuisine_italian">Italian</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input cuisine" type="checkbox" value="Mexican" id="cuisine_mexican">
                                            <label class="form-check-label" for="cuisine_mexican">Mexican</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input cuisine" type="checkbox" value="Fast Food" id="cuisine_fastfood">
                                            <label class="form-check-label" for="cuisine_fastfood">Fast Food</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input cuisine" type="checkbox" value="South Indian" id="cuisine_southindian">
                                            <label class="form-check-label" for="cuisine_southindian">South Indian</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input cuisine" type="checkbox" value="North Indian" id="cuisine_northindian">
                                            <label class="form-check-label" for="cuisine_northindian">North Indian</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Food Type -->
                            <div class="mb-4">
                                <label for="foodType" class="form-label fw-bold">🥗 Food Type</label>
                                <select class="form-select form-select-lg" id="foodType" required>
                                    <option value="">Select your preference</option>
                                    <option value="Vegetarian">Vegetarian</option>
                                    <option value="Non-Vegetarian">Non-Vegetarian</option>
                                    <option value="Vegan">Vegan</option>
                                    <option value="Any">Any</option>
                                </select>
                            </div>

                            <!-- Restaurant Type -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">🏪 Restaurant Type (Select all you like)</label>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input restaurant-type" type="checkbox" value="Cafe" id="rest_cafe">
                                            <label class="form-check-label" for="rest_cafe">Café</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input restaurant-type" type="checkbox" value="Restaurant" id="rest_restaurant">
                                            <label class="form-check-label" for="rest_restaurant">Restaurant</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input restaurant-type" type="checkbox" value="Fast Food" id="rest_fastfood">
                                            <label class="form-check-label" for="rest_fastfood">Fast Food</label>
                                        </div>
                                        <div class="form-check">
                                            <input class="form-check-input restaurant-type" type="checkbox" value="Buffet" id="rest_buffet">
                                            <label class="form-check-label" for="rest_buffet">Buffet</label>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Dietary Requirement -->
                            <div class="mb-4">
                                <label for="dietary" class="form-label fw-bold">🚫 Dietary Requirements</label>
                                <select class="form-select form-select-lg" id="dietary" required>
                                    <option value="">Select your requirement</option>
                                    <option value="None">None</option>
                                    <option value="Jain">Jain</option>
                                    <option value="Gluten Free">Gluten Free</option>
                                    <option value="Lactose Free">Lactose Free</option>
                                    <option value="Vegan">Vegan</option>
                                </select>
                            </div>

                            <!-- Mood -->
                            <div class="mb-4">
                                <label for="mood" class="form-label fw-bold">😊 Mood / Occasion</label>
                                <select class="form-select form-select-lg" id="mood" required>
                                    <option value="">Select your mood</option>
                                    <option value="Casual">Casual</option>
                                    <option value="Party">Party</option>
                                    <option value="Family">Family</option>
                                    <option value="Study Break">Study Break</option>
                                    <option value="Any">Any</option>
                                </select>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">Submit Preferences</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('preferencesForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const cuisines = Array.from(document.querySelectorAll('.cuisine:checked')).map(el => el.value);
            const restTypes = Array.from(document.querySelectorAll('.restaurant-type:checked')).map(el => el.value);
            
            const data = {
                budget: document.getElementById('budget').value,
                cuisine: cuisines,
                food_type: document.getElementById('foodType').value,
                restaurant_type: restTypes,
                dietary_requirement: document.getElementById('dietary').value,
                mood: document.getElementById('mood').value
            };
            
            try {
                const response = await fetch('/preferences', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    alert('Preferences submitted! Waiting for other members...');
                    window.location.href = '/group/' + result.group_id + '/summary';
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error submitting preferences: ' + error);
            }
        });
    </script>
</body>
</html>
