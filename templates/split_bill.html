<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Bill - DineMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                🍽️ <span class="text-primary">DineMatch</span>
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg">
                    <div class="card-body p-5">
                        <h2 class="card-title text-center mb-4">💳 Split the Bill</h2>
                        <p class="text-center text-muted mb-4">Divide the total bill among group members</p>
                        
                        <form id="splitBillForm">
                            <div class="mb-4">
                                <label for="totalBill" class="form-label fw-bold">Total Bill Amount</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" class="form-control" id="totalBill" placeholder="e.g., 2000" step="0.01" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="members" class="form-label fw-bold">Number of Members</label>
                                <input type="number" class="form-control form-control-lg" id="members" min="1" placeholder="e.g., 4" required>
                            </div>

                            <div class="mb-4">
                                <label for="tip" class="form-label fw-bold">Tip (Optional)</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text">₹</span>
                                    <input type="number" class="form-control" id="tip" placeholder="e.g., 200" step="0.01" value="0">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">Calculate Split</button>
                        </form>

                        <div id="result" class="mt-5" style="display: none;">
                            <div class="alert alert-info">
                                <div class="row">
                                    <div class="col-6">
                                        <small class="text-muted">Total Amount</small>
                                        <h5 id="resultTotal">₹0</h5>
                                    </div>
                                    <div class="col-6">
                                        <small class="text-muted">Per Person</small>
                                        <h5 id="resultPerPerson" class="text-success">₹0</h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('splitBillForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const total = parseFloat(document.getElementById('totalBill').value);
            const members = parseInt(document.getElementById('members').value);
            const tip = parseFloat(document.getElementById('tip').value) || 0;
            
            try {
                const response = await fetch('/split_bill', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({total, members, tip})
                });
                
                const data = await response.json();
                if (data.success) {
                    document.getElementById('resultTotal').textContent = '₹' + data.total.toFixed(2);
                    document.getElementById('resultPerPerson').textContent = '₹' + data.per_person.toFixed(2);
                    document.getElementById('result').style.display = 'block';
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error calculating split: ' + error);
            }
        });
    </script>
</body>
</html>
